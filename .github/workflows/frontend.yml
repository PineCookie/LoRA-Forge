name: Frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "lora_forge/schema/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "lora_forge/schema/**"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # the tests evaluate the real schema files in lora_forge/schema
      - run: npm test
      - run: npm run build
