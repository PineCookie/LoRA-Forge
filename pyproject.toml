[project]
name = "lora-forge"
version = "1.1.0"
description = "Web UI for training LoRA models (Anima, FLUX, SD3.5, SDXL, SD1.5) with kohya-ss/sd-scripts"
readme = "README.md"
license-files = ["LICENSE"]
requires-python = "==3.12.*"
dependencies = [
    # Torch
    "torch>=2.9,<2.15",
    "torchvision",
    "triton<3.9; sys_platform != 'win32'",
    "triton-windows<3.9; sys_platform == 'win32'",
    "xformers>=0.0.35",
    # Training core
    "accelerate>=1.15.0",
    "bitsandbytes>=0.49.2",
    "dadaptation>=3.2",
    "diffusers[torch]>=0.40.0",
    "lion-pytorch",
    "lycoris-lora>=3.4.0",
    "prodigy-plus-schedule-free>=2.0.1",
    "prodigyopt",
    "pytorch-optimizer",
    "schedulefree>=1.4.1",
    "safetensors>=0.8.0",
    "transformers==5.17.0",
    # musubi-tuner (Krea 2) imports these in its dataset / Wan code paths
    "av>=17.1.0",
    "easydict>=1.13",
    # Scientific/image utilities
    "einops",
    "ftfy",
    "imagesize>=2.0.0",
    "numpy>=2.4.5",
    "opencv-python",
    "pillow>=12.2.0",
    # not imported directly: diffusers loads it for the preview samplers (dpmsolver, lms, ...)
    "scipy>=1.17.1",
    "sentencepiece>=0.2.1",
    # App/runtime utilities
    "huggingface-hub>=1.32.0",
    "packaging>=26.2",
    "psutil>=7.2.2",
    "rich>=13.7.0",
    "tqdm>=4.67.3",
    "toml>=0.10.2",
    "voluptuous>=0.16.0",
    # Training logs (log_with = tensorboard / wandb)
    "tensorboard>=2.20.0",
    "wandb>=0.27.0",
    # UI/server
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "uvicorn>=0.47.0",
]

[project.optional-dependencies]
# `uv sync --extra flash-attn`; the launcher keeps it in sync once it is installed. Prebuilt wheels
# from mjun0812/flash-attention-prebuild-wheels (sources below), so nothing is built locally.
flash-attn = [
    "flash-attn; sys_platform == 'win32' or (sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64'))",
]

[tool.uv.sources]
torch = [{ index = "pytorch" }]
torchvision = [{ index = "pytorch" }]
xformers = [{ index = "pytorch" }]
# must match torch / CUDA / Python above (cu130, torch 2.14, cp312): update these with every torch bump
flash-attn = [
    { url = "https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.10.2/flash_attn-2.8.3+cu130torch2.14-cp312-cp312-win_amd64.whl", marker = "sys_platform == 'win32'" },
    { url = "https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.10.0/flash_attn-2.8.3+cu130torch2.14-cp312-cp312-linux_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { url = "https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.10.1/flash_attn-2.8.3+cu130torch2.14-cp312-cp312-linux_aarch64.whl", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
